[package]
name = "jamsrpay-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
pbjson-types = "0.9.0"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0", features = ["derive"] }
tonic = "0.14"
tonic-prost = "0.14"

[features]
default = []
full = [
    "billing",
    "blockchain",
    "identity",
    "indexer",
    "payout",
    "realtime",
    "shared",
    "store",
    "support",
    "user",
    "verification",
    "wallet",
    "webhook",
]
billing = ["shared"]
blockchain = ["shared"]
identity = ["shared"]
indexer = ["shared"]
payout = ["shared"]
realtime = ["shared"]
shared = []
store = ["shared"]
support = ["shared"]
user = ["shared"]
verification = ["shared"]
wallet = ["shared"]
webhook = ["shared"]
